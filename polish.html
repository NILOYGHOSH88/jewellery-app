<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>স্বর্ণ জ্যোতি হিসাব - পলিশের হিসাব</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-main: #140c06;
    --card-bg: rgba(31, 20, 10, 0.85);
    --panel-bg: #110904;
    --accent-gold: #e6af2e;
    --accent-gold-hover: #f4c430;
    --text-main: #fcf6ec;
    --text-muted: #b39c83;
    --border-gold: rgba(230, 175, 46, 0.3);
    --input-bg: #2a1c10;
    --success: #22c55e;
    --primary-blue: #3b82f6;
}

*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
    background: radial-gradient(circle at center, #2b1708 0%, #140c06 100%);
    color: var(--text-main);
    padding: 12px;
    padding-bottom: calc(90px + env(safe-area-inset-bottom));
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.app-container {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-gold);
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 15px rgba(230,175,46,0.1);
}

.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-gold);
}

.brand-info h1 {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent-gold);
}

.brand-info p {
    font-size: 11px;
    color: var(--text-muted);
}

.logo-badge {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #e6af2e, #996515);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 16px;
    box-shadow: 0 3px 10px rgba(230,175,46,0.4);
}

/* Navigation Tabs */
.nav-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
}

.nav-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    border-radius: 10px;
    text-decoration: none;
    transition: all 0.2s ease;
}

.nav-tab.inactive {
    background: var(--panel-bg);
    color: var(--text-muted);
    border: 1px solid var(--border-gold);
}

.nav-tab.active {
    background: var(--accent-gold);
    color: #140c06;
    box-shadow: 0 4px 12px rgba(230,175,46,0.3);
}

/* Form Groups */
.form-group {
    margin-bottom: 12px;
}

label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 5px;
}

input, select {
    width: 100%;
    height: 46px;
    padding: 0 14px;
    font-size: 15px;
    background: var(--input-bg);
    border: 1px solid var(--border-gold);
    border-radius: 12px;
    color: var(--text-main);
    outline: none;
    transition: all 0.2s;
}

input:focus, select:focus {
    border-color: var(--accent-gold);
    box-shadow: 0 0 8px rgba(230,175,46,0.25);
}

/* Quick Preset Chips */
.quick-presets {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    overflow-x: auto;
    padding-bottom: 4px;
}

.preset-chip {
    background: var(--panel-bg);
    border: 1px solid var(--border-gold);
    color: var(--accent-gold);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
}
.preset-chip:hover {
    background: var(--input-bg);
}

/* Result Box & Mini Receipt Breakdown */
.calc-display {
    background: var(--panel-bg);
    border: 1px solid var(--border-gold);
    border-radius: 14px;
    padding: 14px;
    margin-top: 14px;
}

.receipt-breakdown {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px dashed rgba(230, 175, 46, 0.2);
    display: flex;
    justify-content: space-between;
}

.calc-display .label {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
}

.calc-display .value {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent-gold);
    text-align: center;
}

/* Fixed Bottom Action Bar */
.bottom-action-bar {
    position: fixed;
    bottom: 0; left: 0; width: 100%;
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border-gold);
    padding: 10px 16px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    z-index: 100;
    box-shadow: 0 -5px 20px rgba(0,0,0,0.4);
}

.action-btn {
    flex: 1;
    height: 48px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform 0.15s ease;
}
.action-btn:active { transform: scale(0.97); }

.btn-save { background: var(--success); color: #0d1a10; }
.btn-print { background: var(--primary-blue); color: #fff; }

/* Toast Notification */
#toast {
    position: fixed;
    bottom: calc(75px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #22c55e;
    color: #fff;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 1000;
}
#toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <div class="brand-info">
            <h1>Swarnajyoti</h1>
            <p>স্বর্ণ জ্যোতি হিসাব</p>
        </div>
        <div class="logo-badge">✨</div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <a href="index.html" class="nav-tab inactive">সাধারণ ক্যালকুলেটর</a>
        <a href="polish.html" class="nav-tab active">পলিশের হিসাব পেজ</a>
    </div>

    <!-- Polish Form Fields -->
    <div class="form-group">
        <label for="custName">👤 কাস্টমারের নাম</label>
        <input type="text" id="custName" placeholder="নাম লিখুন..." autocomplete="name" oninput="savePolishData()">
    </div>

    <div class="form-group">
        <label for="itemType">💍 গহনার ধরণ</label>
        <select id="itemType" onchange="calculatePolish(); savePolishData();">
            <option value="আংটি">আংটি</option>
            <option value="গলার চেইন">গলার চেইন</option>
            <option value="কানের দুল">কানের দুল</option>
            <option value="বালা / চুড়ি">বালা / চুড়ি</option>
            <option value="অন্যান্য">অন্যান্য</option>
        </select>
    </div>

    <div class="form-group">
        <label for="itemWeight">⚖️ গহনার ওজন (গ্রাম বা ভরি)</label>
        <input type="number" step="any" id="itemWeight" placeholder="যেমন: ৫ বা ১.৫" oninput="calculatePolish()">
    </div>

    <!-- Quick Presets for Rate -->
    <div class="quick-presets">
        <span style="font-size: 11px; color: var(--text-muted); align-self: center;">রেট শর্টকাট:</span>
        <button type="button" class="preset-chip" onclick="setRate(300)">৩০০৳</button>
        <button type="button" class="preset-chip" onclick="setRate(500)">৫০০৳</button>
        <button type="button" class="preset-chip" onclick="setRate(800)">৮০০৳</button>
        <button type="button" class="preset-chip" onclick="setRate(1000)">১০০০৳</button>
    </div>

    <div class="form-group">
        <label for="polishRate">💰 প্রতি একক পলিশ খরচ (টাকা)</label>
        <input type="number" id="polishRate" placeholder="যেমন: ৫০০" oninput="calculatePolish()">
    </div>

    <!-- Live Mini Receipt & Total Display -->
    <div class="calc-display">
        <div class="receipt-breakdown" id="receiptBreakdown">
            <span>বিবরণ: ওজন ০ × রেট ০</span>
            <span>পাকা মেমো</span>
        </div>
        <div class="label">✨ সর্বমোট পলিশ খরচ</div>
        <div class="value" id="polishTotal">৳ ০</div>
    </div>
</div>

<!-- Fixed Bottom Action Bar -->
<div class="bottom-action-bar">
    <button type="button" class="action-btn btn-save" onclick="saveToGoogleSheets()">💾 গুগল শিটে সেভ</button>
    <button type="button" class="action-btn btn-print" onclick="printPolish()">🖨️ প্রিন্ট / পিডিএফ</button>
</div>

<div id="toast">সফলভাবে সেভ হয়েছে! ✅</div>

<script>
function triggerVibration() {
    if (navigator.vibrate) navigator.vibrate(20);
}

function toBengaliDigits(str) {
    const englishMap = {'0':'০', '1':'১', '2':'২', '3':'৩', '4':'৪', '5':'৫', '6':'৬', '7':'৭', '8':'৮', '9':'৯'};
    return str.toString().replace(/[0-9]/g, d => englishMap[d] !== undefined ? englishMap[d] : d);
}

function setRate(val) {
    triggerVibration();
    document.getElementById("polishRate").value = val;
    calculatePolish();
}

function calculatePolish() {
    let weight = parseFloat(document.getElementById("itemWeight").value) || 0;
    let rate = parseFloat(document.getElementById("polishRate").value) || 0;
    let total = weight * rate;

    let formattedWeight = toBengaliDigits(weight);
    let formattedRate = toBengaliDigits(rate.toLocaleString('en-IN'));
    let formattedTotal = total.toLocaleString('en-IN');

    document.getElementById("receiptBreakdown").innerHTML = `<span>ওজন: ${formattedWeight} × রেট: ${formattedRate}</span><span>মেমো ভিউ</span>`;
    document.getElementById("polishTotal").innerText = "৳ " + toBengaliDigits(formattedTotal);
    savePolishData();
}

function savePolishData() {
    let data = {
        name: document.getElementById("custName").value,
        item: document.getElementById("itemType").value,
        weight: document.getElementById("itemWeight").value,
        rate: document.getElementById("polishRate").value,
        total: document.getElementById("polishTotal").innerText
    };
    localStorage.setItem("swarna_polish_data", JSON.stringify(data));
}

window.addEventListener("DOMContentLoaded", () => {
    let saved = localStorage.getItem("swarna_polish_data");
    if (saved) {
        try {
            let data = JSON.parse(saved);
            if (data.name) document.getElementById("custName").value = data.name;
            if (data.item) document.getElementById("itemType").value = data.item;
            if (data.weight) document.getElementById("itemWeight").value = data.weight;
            if (data.rate) document.getElementById("polishRate").value = data.rate;
            calculatePolish();
        } catch(e) { console.error(e); }
    }
});

function showToast(msg) {
    let t = document.getElementById("toast");
    t.innerText = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
}

function saveToGoogleSheets() {
    triggerVibration();
    let totalVal = document.getElementById("polishTotal").innerText;
    if (totalVal === "৳ ০" || totalVal === "৳ ") {
        showToast("⚠️ সেভ করার মতো কোনো তথ্য নেই!");
        return;
    }
    showToast("পলিশের হিসাব সফলভাবে গুগল শিটে সেভ হয়েছে! ✅");
}

function printPolish() {
    triggerVibration();
    let totalVal = document.getElementById("polishTotal").innerText;
    if (totalVal === "৳ ০" || totalVal === "৳ ") {
        showToast("⚠️ প্রিন্ট করার মতো কোনো তথ্য নেই!");
        return;
    }
    window.print();
}
</script>
</body>
</html>
