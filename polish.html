<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JewelCalc Pro - লিশের হিসাব</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Hind+Siliguri:wght@500;700&display=swap');

        body {
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            font-family: 'Hind Siliguri', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #f3f4f6;
            padding: 15px;
            box-sizing: border-box;
        }

        .calculator-container {
            background: linear-gradient(145deg, rgba(17, 24, 39, 0.9), rgba(3, 7, 18, 0.95));
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(212, 175, 55, 0.15);
            border: 2px solid #d4af37;
            position: relative;
        }

        .calculator-container::before {
            content: '★ JewelCalc Pro ★';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #d4af37;
            color: #030712;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 10px;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            background: rgba(212, 175, 55, 0.05);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            margin-top: 8px;
        }

        .nav-buttons button {
            flex: 1;
            background: transparent;
            border: none;
            padding: 6px 2px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            color: #9ca3af;
            font-size: 11px;
            font-family: 'Hind Siliguri', sans-serif;
            transition: all 0.3s ease;
            text-align: center;
        }

        .nav-buttons button.active {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #030712;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        h2 {
            text-align: center;
            color: #d4af37;
            font-size: 18px;
            margin: 10px 0 15px 0;
            font-family: 'Cinzel', serif;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #d1d5db;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            background: #0b0f19;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            color: #fff;
            padding: 8px 12px;
            font-size: 13px;
            font-family: 'Hind Siliguri', sans-serif;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: #d4af37;
            outline: none;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #d4af37, #997a15);
            color: #030712;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            font-family: 'Hind Siliguri', sans-serif;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: all 0.2s ease;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        #successMsg {
            text-align: center;
            font-size: 12px;
            color: #34d399;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <div class="nav-buttons">
        <button onclick="location.href='index.html'">ক্যালকুলেটর</button>
        <button class="active">লিশের হিসাব</button>
        <button onclick="location.href='price.html'">দামের হিসাব</button>
    </div>

    <h2>লিশের হিসাব</h2>

    <div class="form-group">
        <label>তারিখ</label>
        <input type="date" id="polishDate">
    </div>

    <div class="form-group">
        <label>গ্রাহকের নাম</label>
        <input type="text" id="custName" placeholder="গ্রাহকের নাম লিখুন">
    </div>

    <div class="form-group">
        <label>আইটেমের নাম (যেমন: আংটি, চেইন)</label>
        <input type="text" id="itemName" placeholder="আইটেমের নাম লিখুন">
    </div>

    <div class="form-group">
        <label>পলিশের আগের ওজন (গ্রাম/ভরি)</label>
        <input type="text" id="weightBefore" placeholder="আগের ওজন লিখুন">
    </div>

    <div class="form-group">
        <label>পলিশের পরের ওজন (গ্রাম/ভরি)</label>
        <input type="text" id="weightAfter" placeholder="পরের ওজন লিখুন">
    </div>

    <div class="form-group">
        <label>কত পিস</label>
        <input type="number" id="totalPcs" placeholder="পিস সংখ্যা লিখুন">
    </div>

    <button class="btn-submit" onclick="savePolishData()">গুগল শিটে সেভ করুন</button>
    <div id="successMsg">সফলভাবে সেভ হয়েছে!</div>
</div>

<script>
    document.getElementById('polishDate').valueAsDate = new Date();

    function savePolishData() {
        let dateVal = document.getElementById('polishDate').value;
        let nameVal = document.getElementById('custName').value;
        let itemVal = document.getElementById('itemName').value;
        let beforeVal = document.getElementById('weightBefore').value;
        let afterVal = document.getElementById('weightAfter').value;
        let pcsVal = document.getElementById('totalPcs').value;

        if (!nameVal || !itemVal) {
            alert('দمه করে গ্রাহকের নাম এবং আইটেমের নাম লিখুন!');
            return;
        }

        const scriptURL = 'https://script.google.com/macros/s/AKfycbwzXmqzhBmUsk1YD1c0kiYi5nRgItzP8mBx2DNcCpHmmxoFZHd6Zy0MJioI8NJN6Jbp/exec';

        // গুগল শিটে পাঠানোর জন্য সব ডেটা একটি সুন্দর ফরম্যাটে সাজানো
        let detailsText = `গ্রাহক: ${nameVal}, আইটেম: ${itemVal}, আগের ওজন: ${beforeVal}, পরের ওজন: ${afterVal}, পিস: ${pcsVal}`;

        let payload = {
            type: "Polish",
            date: dateVal,
            itemDesc: nameVal + " (" + itemVal + ")",
            totalPrice: detailsText
        };

        let btn = document.querySelector('.btn-submit');
        btn.innerText = "সেভ হচ্ছে...";

        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            console.log('Success:', data);
            btn.innerText = "গুগল শিটে সেভ করুন";
            
            let msg = document.getElementById('successMsg');
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 3000);

            // ফরম খালি করা
            document.getElementById('custName').value = '';
            document.getElementById('itemName').value = '';
            document.getElementById('weightBefore').value = '';
            document.getElementById('weightAfter').value = '';
            document.getElementById('totalPcs').value = '';
        })
        .catch(error => {
            console.error('Error!', error);
            btn.innerText = "গুগল শিটে সেভ করুন";
            alert('সেভ করতে সমস্যা হয়েছে, আবার চেষ্টা করুন।');
        });
    }
</script>

</body>
</html>
