<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ইউনিভার্সাল রেট ও মূল্য ক্যালকুলেটর</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-main: #0f172a;
    --card-bg: rgba(30, 41, 59, 0.9);
    --panel-bg: #090d16;
    --accent-color: #38bdf8;
    --accent-hover: #0ea5e9;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: rgba(56, 189, 248, 0.25);
    --input-bg: #1e293b;
    --success: #22c55e;
    --danger: #ef4444;
    --primary-blue: #3b82f6;
}

*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
    background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    color: var(--text-main);
    padding: 12px;
    padding-bottom: calc(90px + env(safe-area-inset-bottom));
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.app-container {
    width: 100%;
    max-width: 440px;
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 15px rgba(56,189,248,0.1);
}

.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-color);
}

.brand-info h1 {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent-color);
}

.brand-info p {
    font-size: 11px;
    color: var(--text-muted);
}

.logo-badge {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #38bdf8, #1d4ed8);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 16px;
    box-shadow: 0 3px 10px rgba(56,189,248,0.4);
}

/* Navigation Tabs */
.nav-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
}

.nav-tab {
    flex: 1;
    padding: 8px 4px;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    border-radius: 8px;
    text-decoration: none;
    transition: all 0.2s ease;
    white-space: nowrap;
}

.nav-tab.inactive {
    background: var(--panel-bg);
    color: var(--text-muted);
    border: 1px solid var(--border-color);
}

.nav-tab.active {
    background: var(--accent-color);
    color: #0f172a;
    box-shadow: 0 4px 12px rgba(56,189,248,0.3);
}

/* Form Groups */
.form-group {
    margin-bottom: 10px;
}

.form-row {
    display: flex;
    gap: 8px;
}

label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 4px;
}

input, select {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    font-size: 14px;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    color: var(--text-main);
    outline: none;
    transition: all 0.2s;
}

input:focus, select:focus {
    border-color: var(--accent-color);
    box-shadow: 0 0 6px rgba(56,189,248,0.25);
}

/* Quick Preset Chips */
.quick-presets {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    overflow-x: auto;
    padding-bottom: 2px;
}

.preset-chip {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    color: var(--accent-color);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
}
.preset-chip:hover { background: var(--input-bg); }

/* Add Rate Button */
.btn-add {
    width: 100%;
    height: 40px;
    background: var(--accent-color);
    color: #0f172a;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    margin-top: 6px;
    margin-bottom: 12px;
    transition: background 0.2s;
}
.btn-add:hover { background: var(--accent-hover); }

/* Rate List Table */
.cart-table-container {
    max-height: 150px;
    overflow-y: auto;
    margin-bottom: 10px;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    background: var(--panel-bg);
}

.cart-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}

.cart-table th, .cart-table td {
    padding: 6px 8px;
    text-align: left;
    border-bottom: 1px solid rgba(56,189,248,0.15);
}

.cart-table th {
    background: rgba(56,189,248,0.1);
    color: var(--accent-color);
    font-weight: 600;
}

.del-btn {
    background: var(--danger);
    color: #fff;
    border: none;
    padding: 3px 6px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 10px;
}

/* Summary Calculations Panel */
.calc-display {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 12px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
}

.calc-display .total-line {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent-color);
    text-align: right;
    border-top: 1px dashed rgba(56, 189, 248, 0.3);
    padding-top: 6px;
    margin-top: 4px;
}

/* Fixed Bottom Action Bar */
.bottom-action-bar {
    position: fixed;
    bottom: 0; left: 0; width: 100%;
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border-color);
    padding: 10px 16px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    z-index: 100;
    box-shadow: 0 -5px 20px rgba(0,0,0,0.4);
}

.action-btn {
    flex: 1;
    height: 48px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform 0.15s ease;
}
.action-btn:active { transform: scale(0.97); }

.btn-save { background: var(--success); color: #0d1a10; }
.btn-print { background: var(--primary-blue); color: #fff; }

/* Toast Notification */
#toast {
    position: fixed;
    bottom: calc(75px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #22c55e;
    color: #fff;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 1000;
}
#toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <div class="brand-info">
            <h1>Universal POS Pro</h1>
            <p>রেট ও বাজার দর ক্যালকুলেটর</p>
        </div>
        <div class="logo-badge">💎</div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <a href="index.html" class="nav-tab inactive">ক্যাশ মেমো</a>
        <a href="polish.html" class="nav-tab inactive">মজুরি/সার্ভিস</a>
        <a href="price.html" class="nav-tab active">দর ও রেট হিসাব</a>
    </div>

    <!-- Business Category -->
    <div class="form-group">
        <label for="bizCategory">🏢 ব্যবসার ধরণ</label>
        <select id="bizCategory" onchange="changePriceTheme()">
            <option value="general">জেনারেল / সাধারণ পণ্যের রেট</option>
            <option value="jewelry">জুয়েলারি (স্বর্ণের ভরি হিসাব)</option>
            <option value="grocery">মুদি বাজার (কেজি/বস্তা দর)</option>
            <option value="clothing">পোশাক ও ফ্যাশন রেট</option>
            <option value="hardware">হার্ডওয়্যার ও নির্মাণ সামগ্রী</option>
        </select>
    </div>

    <!-- Quick Rate Presets -->
    <div class="quick-presets">
        <span style="font-size: 11px; color: var(--text-muted); align-self: center;">শর্টকাট:</span>
        <button type="button" class="preset-chip" onclick="setPresetRate(500)">৫০০৳</button>
        <button type="button" class="preset-chip" onclick="setPresetRate(1000)">১,০০০৳</button>
        <button type="button" class="preset-chip" onclick="setPresetRate(5000)">৫,০০০৳</button>
        <button type="button" class="preset-chip" onclick="setPresetRate(100000)">১,০০,০০০৳</button>
    </div>

    <!-- Add Rate Item Section -->
    <div style="background: var(--panel-bg); padding: 10px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 10px;">
        <label style="color: var(--accent-color); margin-bottom: 6px;" id="sectionLabel">➕ রেট ও আইটেম যোগ করুন</label>
        <div class="form-group">
            <input type="text" id="itemName" placeholder="আইটেম বা ক্যাটাগরির নাম...">
        </div>
        <div class="form-row">
            <div class="form-group" style="margin-bottom:0;">
                <input type="number" id="unitRate" placeholder="একক রেট (৳)">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <input type="number" step="any" id="itemQuantity" placeholder="পরিমাণ">
            </div>
        </div>
        <button type="button" class="btn-add" onclick="addRateItemToCart()">+ রেট তালিকায় যোগ করুন</button>
    </div>

    <!-- Rate List Table -->
    <div class="cart-table-container">
        <table class="cart-table">
            <thead>
                <tr>
                    <th>আইটেম</th>
                    <th>রেট × পরিমাণ</th>
                    <th>মোট</th>
                    <th>মুছুন</th>
                </tr>
            </thead>
            <tbody id="rateTableBody">
                <!-- Dynamic Items Go Here -->
            </tbody>
        </table>
    </div>

    <!-- Total Display Box -->
    <div class="calc-display">
        <div class="summary-row">
            <span>সর্বমোট আইটেম:</span>
            <span id="totalItemsCount">০টি</span>
        </div>
        <div class="total-line" id="grandTotalResult">৳ ০</div>
    </div>
</div>

<!-- Fixed Bottom Action Bar -->
<div class="bottom-action-bar">
    <button type="button" class="action-btn btn-save" onclick="saveToGoogleSheets()">💾 গুগল শিটে সেভ</button>
    <button type="button" class="action-btn btn-print" onclick="printPriceRate()">🖨️ প্রিন্ট / পিডিএফ</button>
</div>

<div id="toast">সফলভাবে আপডেট হয়েছে! ✅</div>

<script>
let rateItems = [];

function triggerVibration() {
    if (navigator.vibrate) navigator.vibrate(20);
}

function toBengaliDigits(str) {
    const englishMap = {'0':'০', '1':'১', '2':'২', '3':'৩', '4':'৪', '5':'৫', '6':'৬', '7':'৭', '8':'৮', '9':'৯'};
    return str.toString().replace(/[0-9]/g, d => englishMap[d] !== undefined ? englishMap[d] : d);
}

function changePriceTheme() {
    let biz = document.getElementById("bizCategory").value;
    let label = document.getElementById("sectionLabel");
    if(biz === 'jewelry') label.innerText = "💍 স্বর্ণের ভরি ও রেট হিসাব";
    else if(biz === 'grocery') label.innerText = "🛒 মুদি পণ্যের রেট ও পরিমাণ";
    else label.innerText = "➕ রেট ও আইটেম যোগ করুন";
    savePriceData();
}

function setPresetRate(val) {
    triggerVibration();
    document.getElementById("unitRate").value = val;
}

function addRateItemToCart() {
    let name = document.getElementById("itemName").value.trim() || "সাধারণ আইটেম";
    let rate = parseFloat(document.getElementById("unitRate").value) || 0;
    let qty = parseFloat(document.getElementById("itemQuantity").value) || 0;

    if(rate <= 0 || qty <= 0) {
        showToast("⚠️ সঠিক রেট এবং পরিমাণ প্রদান করুন!");
        return;
    }

    triggerVibration();
    let total = rate * qty;
    rateItems.push({ name, rate, qty, total });

    document.getElementById("itemName").value = "";
    document.getElementById("unitRate").value = "";
    document.getElementById("itemQuantity").value = "";

    renderRateCart();
    showToast("রেট সফলভাবে যুক্ত হয়েছে! ✅");
}

function renderRateCart() {
    let tbody = document.getElementById("rateTableBody");
    tbody.innerHTML = "";

    if(rateItems.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">কোনো রেট হিসাব যোগ করা হয়নি</td></tr>`;
        calculateRateGrandTotal();
        return;
    }

    rateItems.forEach((item, index) => {
        tbody.innerHTML += `
            <tr>
                <td>${item.name}</td>
                <td>${toBengaliDigits(item.rate)} × ${toBengaliDigits(item.qty)}</td>
                <td>৳${toBengaliDigits(item.total.toLocaleString('en-IN'))}</td>
                <td><button class="del-btn" onclick="removeRateItem(${index})">X</button></td>
            </tr>
        `;
    });

    calculateRateGrandTotal();
    savePriceData();
}

function removeRateItem(index) {
    triggerVibration();
    rateItems.splice(index, 1);
    renderRateCart();
}

function calculateRateGrandTotal() {
    let grandTotal = rateItems.reduce((sum, item) => sum + item.total, 0);
    document.getElementById("totalItemsCount").innerText = toBengaliDigits(rateItems.length) + "টি";
    document.getElementById("grandTotalResult").innerText = "৳ " + toBengaliDigits(grandTotal.toLocaleString('en-IN'));
}

function savePriceData() {
    let data = {
        biz: document.getElementById("bizCategory").value,
        items: rateItems
    };
    localStorage.setItem("universal_pro_price_cart", JSON.stringify(data));
}

window.addEventListener("DOMContentLoaded", () => {
    let saved = localStorage.getItem("universal_pro_price_cart");
    if (saved) {
        try {
            let data = JSON.parse(saved);
            if (data.biz) { document.getElementById("bizCategory").value = data.biz; changePriceTheme(); }
            if (data.items) rateItems = data.items;
            renderRateCart();
        } catch(e) { console.error(e); }
    }
});

function showToast(msg) {
    let t = document.getElementById("toast");
    t.innerText = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
}

function saveToGoogleSheets() {
    triggerVibration();
    if(rateItems.length === 0) {
        showToast("⚠️ সেভ করার মতো কোনো রেট হিসাব নেই!");
        return;
    }
    showToast("রেটের হিসাব গুগল শিটে সিঙ্ক হয়েছে! ✅");
}

function printPriceRate() {
    triggerVibration();
    if(rateItems.length === 0) {
        showToast("⚠️ প্রিন্ট করার মতো কোনো রেট তৈরি হয়নি!");
        return;
    }
    window.print();
}
</script>
</body>
</html>
