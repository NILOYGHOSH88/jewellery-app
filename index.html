<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>স্বর্ণের হিসাব ক্যালকুলেটর</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* CSS Variables & Theme Setup */
:root {
    --bg: #121212;
    --card: #1e1e1e;
    --gold: #d4af37;
    --gold-light: #f3e5ab;
    --text: #ffffff;
    --muted: #aaaaaa;
    --border: rgba(212, 175, 55, 0.3);
    --input-bg: #2a2a2a;
    --input-text: #ffffff;
}

[data-theme="light"] {
    --bg: #f2f4f7;
    --card: #ffffff;
    --gold: #b8860b;
    --gold-light: #fff8e1;
    --text: #333333;
    --muted: #666666;
    --border: #dddddd;
    --input-bg: #fafafa;
    --input-text: #333333;
}

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    transition: background 0.3s, color 0.3s, border 0.3s;
}

body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container{
    width: 100%;
    max-width: 500px;
    background: var(--card);
    padding: 25px;
    border-radius: 20px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* Header & Theme Toggle */
.header-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

h2{
    color: var(--gold);
    font-size: 22px;
}

.theme-btn {
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
}

.theme-btn:hover {
    border-color: var(--gold);
}

.form-group{
    margin-bottom: 15px;
}

label{
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: var(--text);
    font-size: 15px;
}

input, select{
    width: 100%;
    height: 50px;
    padding: 0 15px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    background: var(--input-bg);
    color: var(--input-text);
}

input:focus, select:focus{
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
}

.row{
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 10px;
}

/* Buttons with Gold Gradient */
.btn{
    width: 100%;
    height: 52px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color: #111;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
}

.btn:hover{
    opacity: 0.9;
    transform: translateY(-2px);
}

.btn-save{
    background: linear-gradient(135deg, #28a745, #218838);
    color: white;
    box-shadow: 0 4px 15px rgba(40, 167, 69, 0.2);
}

/* Result Box */
.result-box{
    margin-top: 20px;
    background: var(--input-bg);
    padding: 15px;
    border-radius: 12px;
    border: 1px solid var(--border);
}

.result-box p{
    font-size: 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    color: var(--muted);
}

.result-box p span {
    color: var(--text);
    font-weight: 600;
}

.total-amount{
    font-size: 20px !important;
    font-weight: bold !important;
    color: var(--gold) !important;
    border-top: 1px solid var(--border);
    padding-top: 10px;
    margin-top: 10px;
}

/* Mobile Responsive */
@media(max-width: 480px) {
    body {
        padding: 10px;
    }
    .container {
        padding: 15px;
    }
    h2 {
        font-size: 18px;
    }
}
</style>
</head>
<body data-theme="dark">

<div class="container">
    <div class="header-box">
        <h2>🪙 স্বর্ণের হিসাব</h2>
        <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">☀️ লাইট মোড</button>
    </div>

    <div class="form-group">
        <label>হিসাবের নাম বা গহনার বিবরণ</label>
        <input id="itemDesc" type="text" placeholder="যেমন: গলার হার বা আংটি">
    </div>

    <div class="form-group">
        <label>প্রতি গ্রাম স্বর্ণের দাম (টাকা)</label>
        <input id="goldRate" type="number" placeholder="গ্রাম প্রতি দাম লিখুন">
    </div>

    <div class="form-group">
        <label>স্বর্ণের ওজন</label>
        <div class="row">
            <input id="weight" type="number" step="0.001" placeholder="ওজন লিখুন">
            <select id="unit">
                <option value="gram">গ্রাম</option>
                <option value="vori">ভরি</option>
                <option value="ana">আনা</option>
                <option value="rati">রতি</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label>স্বর্ণের মান (ক্যাারেট)</label>
        <select id="purity">
            <option value="1">২৪ ক্যারেট (খাঁটি)</option>
            <option value="0.916">২২ ক্যারেট</option>
            <option value="0.875">২১ ক্যারেট</option>
            <option value="0.750">১৮ ক্যারেট</option>
        </select>
    </div>

    <div class="form-group">
        <label>মজুরি বা তৈরি খরচ (টাকা)</label>
        <input id="making" type="number" value="0">
    </div>

    <div class="form-group">
        <label>পাথরের দাম (যদি থাকে)</label>
        <input id="stone" type="number" value="0">
    </div>

    <button class="btn" id="calculate">হিসাব করুন</button>

    <div class="result-box">
        <p>স্বর্ণের দাম: <span id="goldValue">৳ ০</span></p>
        <p>মজুরি ও পাথর: <span id="otherValue">৳ ০</span></p>
        <p class="total-amount">সর্বমোট টাকা: <span id="total">৳ ০</span></p>
    </div>

    <button class="btn btn-save" onclick="sendToGoogleSheet()">💾 গুগল শিটে সেভ করুন</button>
</div>

<script>
// Theme Toggle & LocalStorage Logic
const bodyElement = document.body;
const themeToggleBtn = document.getElementById("themeToggle");

// পেজ লোড হওয়ার সময় ইউজারের আগের থিম চেক করা
const savedTheme = localStorage.getItem("jewelTheme") || "dark";
bodyElement.setAttribute("data-theme", savedTheme);
updateThemeButtonText(savedTheme);

function toggleTheme() {
    let currentTheme = bodyElement.getAttribute("data-theme");
    let newTheme = currentTheme === "dark" ? "light" : "dark";
    
    bodyElement.setAttribute("data-theme", newTheme);
    localStorage.setItem("jewelTheme", newTheme);
    updateThemeButtonText(newTheme);
}

function updateThemeButtonText(theme) {
    if (theme === "dark") {
        themeToggleBtn.innerHTML = "☀️ লাইট মোড";
    } else {
        themeToggleBtn.innerHTML = "🌙 ডার্ক মোড";
    }
}

// Calculator Logic
const goldRate = document.getElementById("goldRate");
const weight = document.getElementById("weight");
const unit = document.getElementById("unit");
const purity = document.getElementById("purity");
const itemDesc = document.getElementById("itemDesc");
const making = document.getElementById("making");
const stone = document.getElementById("stone");

const goldValue = document.getElementById("goldValue");
const otherValue = document.getElementById("otherValue");
const total = document.getElementById("total");

function convertWeight(){
    let w = Number(weight.value) || 0;
    if(unit.value == "vori") w = w * 11.664;
    else if(unit.value == "ana") w = w * 0.729;
    else if(unit.value == "rati") w = w * 0.1215;
    return w;
}

function money(value){
    return "৳ " + value.toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

document.getElementById("calculate").onclick = function(){
    let grams = convertWeight();
    let rate = Number(goldRate.value) || 0;
    let purityValue = Number(purity.value) || 1;

    let gold = grams * rate * purityValue;
    let make = Number(making.value) || 0;
    let stoneCharge = Number(stone.value) || 0;
    let others = make + stoneCharge;
    let grand = gold + others;

    goldValue.innerHTML = money(gold);
    otherValue.innerHTML = money(others);
    total.innerHTML = money(grand);
};

// Google Sheet Integration
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTLynJfnG9mjZnckvhFJUyIh51GUjkXGW_5_5x5rbIZxuGORgaBBohm50-982_IMsR/exec";

function sendToGoogleSheet(){
    document.getElementById("calculate").click();

    const data = {
        item: itemDesc.value || "স্বর্ণের গহনা",
        rate: goldRate.value,
        weight: weight.value + " " + unit.value,
        purity: purity.options[purity.selectedIndex].text,
        total: total.innerText,
        date: new Date().toLocaleString()
    };

    fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });

    alert("সফলভাবে গুগল শিটে জমা হয়ে গেছে!");
}
</script>

</body>
</html>
