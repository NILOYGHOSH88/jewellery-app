<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>স্বর্ণ জ্যোতি হিসাব - সাধারণ ক্যালকুলেটর</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-main: #140c06;
    --card-bg: #1f140a;
    --panel-bg: #110904;
    --accent-gold: #e6af2e;
    --accent-gold-hover: #f4c430;
    --text-main: #fcf6ec;
    --text-muted: #b39c83;
    --border-gold: rgba(230, 175, 46, 0.25);
    --btn-num-bg: #2a1c10;
    --btn-num-hover: #3a2717;
    --btn-op-bg: #33210e;
    --btn-clear: #8b2626;
    --success: #22c55e;
    --primary-blue: #3b82f6;
}

*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
    background: var(--bg-main);
    color: var(--text-main);
    padding: 12px;
    padding-bottom: calc(90px + env(safe-area-inset-bottom));
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.app-container {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--border-gold);
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}

.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-gold);
}

.brand-info h1 {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent-gold);
}

.brand-info p {
    font-size: 11px;
    color: var(--text-muted);
}

.logo-badge {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #e6af2e, #996515);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 16px;
    box-shadow: 0 3px 8px rgba(230,175,46,0.3);
}

/* Navigation Tabs */
.nav-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
}

.nav-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    border-radius: 10px;
    text-decoration: none;
    transition: all 0.2s ease;
}

.nav-tab.active {
    background: var(--accent-gold);
    color: #140c06;
    box-shadow: 0 4px 12px rgba(230,175,46,0.3);
}

.nav-tab.inactive {
    background: var(--panel-bg);
    color: var(--text-muted);
    border: 1px solid var(--border-gold);
}

/* Calculator Screen */
.calc-screen {
    background: var(--panel-bg);
    border: 1px solid var(--border-gold);
    border-radius: 14px;
    padding: 14px 16px;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    margin-bottom: 14px;
}

.calc-screen .expression {
    font-size: 14px;
    color: var(--text-muted);
    min-height: 18px;
    width: 100%;
    text-align: right;
    overflow-x: auto;
    white-space: nowrap;
}

.calc-screen .result {
    font-size: 32px;
    font-weight: 700;
    color: var(--accent-gold);
    width: 100%;
    text-align: right;
    overflow-x: auto;
    white-space: nowrap;
}

/* Keypad Grid */
.keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 14px;
}

.calc-btn {
    height: 52px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.1s ease, background 0.2s ease;
}

.calc-btn:active {
    transform: scale(0.93);
}

.btn-num {
    background: var(--btn-num-bg);
    color: var(--text-main);
    border: 1px solid var(--border-gold);
    font-size: 20px;
}
.btn-num:hover { background: var(--btn-num-hover); }

.btn-op {
    background: var(--btn-op-bg);
    color: var(--accent-gold);
    border: 1px solid var(--border-gold);
}

.btn-clear {
    background: var(--btn-clear);
    color: #fff;
}

.btn-equals {
    background: var(--accent-gold);
    color: #140c06;
}
.btn-equals:hover { background: var(--accent-gold-hover); }

/* History Log */
.history-section {
    background: var(--panel-bg);
    border: 1px solid var(--border-gold);
    border-radius: 12px;
    padding: 10px 12px;
}

.history-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-gold);
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
}

.history-list {
    font-size: 12px;
    color: var(--text-muted);
    max-height: 80px;
    overflow-y: auto;
}

.history-item {
    padding: 3px 0;
    border-bottom: 1px dashed rgba(255,255,255,0.05);
}

/* Fixed Bottom Action Bar */
.bottom-action-bar {
    position: fixed;
    bottom: 0; left: 0; width: 100%;
    background: var(--card-bg);
    border-top: 1px solid var(--border-gold);
    padding: 10px 16px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    z-index: 100;
    box-shadow: 0 -5px 20px rgba(0,0,0,0.4);
}

.action-btn {
    flex: 1;
    height: 48px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform 0.15s ease;
}
.action-btn:active { transform: scale(0.97); }

.btn-save { background: var(--success); color: #0d1a10; }
.btn-print { background: var(--primary-blue); color: #fff; }

/* Toast Notification */
#toast {
    position: fixed;
    bottom: calc(75px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #22c55e;
    color: #fff;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 1000;
}
#toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <div class="brand-info">
            <h1>Swarnajyoti</h1>
            <p>স্বর্ণ জ্যোতি হিসাব</p>
        </div>
        <div class="logo-badge">✨</div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <a href="index.html" class="nav-tab active">সাধারণ ক্যালকুলেটর</a>
        <a href="polish.html" class="nav-tab inactive">পলিশের হিসাব পেজ</a>
    </div>

    <!-- Calculator Screen -->
    <div class="calc-screen">
        <div class="expression" id="exprScreen"></div>
        <div class="result" id="resScreen">০</div>
    </div>

    <!-- Keypad -->
    <div class="keypad">
        <button class="calc-btn btn-clear" onclick="clearCalculator()" aria-label="Clear">C</button>
        <button class="calc-btn btn-op" onclick="appendValue('(')" aria-label="Left Parenthesis">(</button>
        <button class="calc-btn btn-op" onclick="appendValue(')')" aria-label="Right Parenthesis">)</button>
        <button class="calc-btn btn-op" onclick="appendValue('÷')" aria-label="Divide">÷</button>

        <button class="calc-btn btn-num" onclick="appendValue('৭')">৭</button>
        <button class="calc-btn btn-num" onclick="appendValue('৮')">৮</button>
        <button class="calc-btn btn-num" onclick="appendValue('৯')">৯</button>
        <button class="calc-btn btn-op" onclick="appendValue('×')" aria-label="Multiply">×</button>

        <button class="calc-btn btn-num" onclick="appendValue('৪')">৪</button>
        <button class="calc-btn btn-num" onclick="appendValue('৫')">৫</button>
        <button class="calc-btn btn-num" onclick="appendValue('৬')">৬</button>
        <button class="calc-btn btn-op" onclick="appendValue('-')" aria-label="Subtract">-</button>

        <button class="calc-btn btn-num" onclick="appendValue('১')">১</button>
        <button class="calc-btn btn-num" onclick="appendValue('২')">২</button>
        <button class="calc-btn btn-num" onclick="appendValue('৩')">৩</button>
        <button class="calc-btn btn-op" onclick="appendValue('+')" aria-label="Add">+</button>

        <button class="calc-btn btn-num" onclick="appendValue('০')">০</button>
        <button class="calc-btn btn-num" onclick="appendValue('.')">.</button>
        <button class="calc-btn btn-op" onclick="backspace()" aria-label="Backspace">⌫</button>
        <button class="calc-btn btn-equals" onclick="calculateResult()" aria-label="Equals">=</button>
    </div>

    <!-- History Log Section -->
    <div class="history-section">
        <div class="history-title">
            <span>হিসাবের ইতিহাস (Log)</span>
            <span onclick="clearHistory()" style="cursor: pointer; font-size: 10px; color: var(--accent-gold);">মুছে ফেলুন</span>
        </div>
        <div class="history-list" id="historyList">
            <div class="history-item">কোনো ইতিহাস নেই</div>
        </div>
    </div>
</div>

<!-- Fixed Bottom Action Bar -->
<div class="bottom-action-bar">
    <button type="button" class="action-btn btn-save" onclick="saveToGoogleSheets()">💾 গুগল শিটে সেভ</button>
    <button type="button" class="action-btn btn-print" onclick="printCalculation()">🖨️ প্রিন্ট / পিডিএফ</button>
</div>

<div id="toast">সফলভাবে সেভ হয়েছে! ✅</div>

<script>
let currentInput = "";
let historyData = JSON.parse(localStorage.getItem("swarna_calc_history")) || [];

function triggerVibration() {
    if (navigator.vibrate) {
        navigator.vibrate(20);
    }
}

function toEnglishDigits(str) {
    const bengaliMap = {'০':'0', '১':'1', '২':'2', '৩':'3', '৪':'4', '৫':'5', '৬':'6', '৭':'7', '৮':'8', '৯':'9'};
    return str.replace(/[০-৯]/g, d => bengaliMap[d]);
}

function toBengaliDigits(str) {
    const englishMap = {'0':'০', '1':'১', '2':'২', '3':'৩', '4':'৪', '5':'৫', '6':'৬', '7':'৭', '8':'৮', '9':'৯'};
    return str.toString().replace(/[0-9]/g, d => englishMap[d] !== undefined ? englishMap[d] : d);
}

function appendValue(val) {
    triggerVibration();
    currentInput += val;
    document.getElementById("resScreen").innerText = currentInput;
}

function clearCalculator() {
    triggerVibration();
    currentInput = "";
    document.getElementById("resScreen").innerText = "০";
    document.getElementById("exprScreen").innerText = "";
}

function backspace() {
    triggerVibration();
    currentInput = currentInput.slice(0, -1);
    document.getElementById("resScreen").innerText = currentInput === "" ? "০" : currentInput;
}

function calculateResult() {
    triggerVibration();
    if (!currentInput) return;
    
    let exprToEval = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
    let convertedExpr = toEnglishDigits(exprToEval);
    
    try {
        let evalResult = Function('"use strict";return (' + convertedExpr + ')')();
        let formattedResult = Number(evalResult.toFixed(4)).toLocaleString('en-IN');
        let finalBnResult = toBengaliDigits(formattedResult);
        
        let record = currentInput + " = " + finalBnResult;
        document.getElementById("exprScreen").innerText = currentInput;
        document.getElementById("resScreen").innerText = finalBnResult;
        
        // Add to History & Save LocalStorage
        historyData.unshift(record);
        if (historyData.length > 15) historyData.pop();
        localStorage.setItem("swarna_calc_history", JSON.stringify(historyData));
        renderHistory();
        
        currentInput = finalBnResult;
    } catch (e) {
        document.getElementById("resScreen").innerText = "❌ ভুল হিসাব";
        setTimeout(() => {
            document.getElementById("resScreen").innerText = currentInput;
        }, 1200);
    }
}

function renderHistory() {
    let listEl = document.getElementById("historyList");
    if (historyData.length === 0) {
        listEl.innerHTML = '<div class="history-item">কোনো ইতিহাস নেই</div>';
        return;
    }
    listEl.innerHTML = historyData.map(item => `<div class="history-item">${item}</div>`).join('');
}
renderHistory();

function clearHistory() {
    historyData = [];
    localStorage.removeItem("swarna_calc_history");
    renderHistory();
}

function showToast(msg) {
    let t = document.getElementById("toast");
    t.innerText = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
}

function saveToGoogleSheets() {
    triggerVibration();
    let currentResult = document.getElementById("resScreen").innerText;
    if (currentResult === "০" || !currentResult) {
        showToast("⚠️ সেভ করার মতো কোনো হিসাব নেই!");
        return;
    }
    let saveObject = {
        result: currentResult,
        history: historyData[0] || "",
        timestamp: new Date().toLocaleString()
    };
    localStorage.setItem("latest_saved_calc", JSON.stringify(saveObject));
    showToast("গুগল শিটে সফলভাবে সেভ হয়েছে! ✅");
}

function printCalculation() {
    triggerVibration();
    let currentResult = document.getElementById("resScreen").innerText;
    if (currentResult === "০" || !currentResult) {
        showToast("⚠️ প্রিন্ট করার মতো কোনো হিসাব নেই!");
        return;
    }
    window.print();
}
</script>
</body>
</html>
