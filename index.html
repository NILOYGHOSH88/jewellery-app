<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>সাধারণ ক্যালকুলেটর - গোল্ডেন লাক্সারি</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Baloo Da 2', sans-serif;
      background: linear-gradient(135deg, #0B1120 0%, #1A2332 100%);
      color: #F7E7A0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      position: relative;
    }
    
    /* ব্যাকগ্রাউন্ড স্পার্কল বা ভাসমান গোল্ডেন ডট অ্যানিমেশন */
    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #F7E7A0;
      border-radius: 50%;
      box-shadow: 0 0 10px #D4AF37, 0 0 20px #F7E7A0;
      animation: floatSparkle 6s infinite ease-in-out;
      z-index: 1;
    }
    .sparkle:nth-child(1) { top: 15%; left: 20%; animation-delay: 0s; }
    .sparkle:nth-child(2) { top: 75%; left: 80%; animation-delay: 2s; }
    .sparkle:nth-child(3) { top: 40%; left: 85%; animation-delay: 4s; }

    @keyframes floatSparkle {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { transform: translateY(-20px) scale(1.4); opacity: 0.9; }
    }

    /* নেভিগেশন বার */
    .navbar {
      margin-bottom: 25px;
      display: flex;
      gap: 12px;
      background: rgba(20, 30, 50, 0.6);
      padding: 8px 15px;
      border-radius: 50px;
      border: 1px solid #D4AF37;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      z-index: 2;
      animation: fadeInDown 0.8s ease-out;
    }
    .navbar a {
      text-decoration: none;
      padding: 10px 22px;
      color: #b2bec3;
      border-radius: 30px;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.4s ease;
    }
    .navbar a:hover {
      color: #F7E7A0;
      background: rgba(212, 175, 55, 0.15);
    }
    .navbar a.active {
      background: linear-gradient(135deg, #D4AF37, #F7E7A0);
      color: #0B1120;
      font-weight: 700;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
      50% { box-shadow: 0 0 25px rgba(247, 231, 160, 0.8); }
    }

    /* ক্যালকুলেটর মেইন কার্ড */
    .calculator {
      background: rgba(26, 35, 50, 0.75);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 25px rgba(212, 175, 55, 0.15);
      border: 1px solid #D4AF37;
      width: 330px;
      z-index: 2;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(15px);
    }

    #display {
      width: 100%;
      height: 65px;
      font-size: 30px;
      text-align: right;
      margin-bottom: 20px;
      padding: 10px 15px;
      box-sizing: border-box;
      border: 2px solid #D4AF37;
      border-radius: 12px;
      background: #0B1120;
      color: #F7E7A0;
      font-family: 'Inter', monospace;
      font-weight: 700;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    /* বাটন গ্রিড */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    
    button {
      padding: 14px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.25s ease;
      font-family: 'Inter', sans-serif;
    }

    /* ১. সংখ্যার বাটন: গ্লাসমরফিক ডার্ক নেভি উইথ গোল্ড বর্ডার */
    .btn-num {
      background: rgba(20, 30, 50, 0.6);
      color: #F7E7A0;
      border: 1px solid #D4AF37;
      box-shadow: inset 0 0 8px rgba(212, 175, 55, 0.1);
    }
    .btn-num:hover {
      background: rgba(212, 175, 55, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    /* ২. অপারেটর: গোল্ড গ্র্যাডিয়েন্ট */
    .btn-op {
      background: linear-gradient(135deg, #D4AF37, #F7E7A0);
      color: #0B1120;
      border: none;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }
    .btn-op:hover {
      background: linear-gradient(135deg, #F7E7A0, #D4AF37);
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(247, 231, 160, 0.7);
    }

    /* ৩. ক্লিয়ার (C) বাটন: গাঢ় লাল-মেরুন */
    .btn-clear {
      background: #8B1E1E;
      color: #ffffff;
      border: 1px solid #ff4d4d;
      grid-column: span 2;
      box-shadow: 0 0 10px rgba(139, 30, 30, 0.5);
    }
    .btn-clear:hover {
      background: #a82424;
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(255, 77, 77, 0.6);
    }

    /* ৪. "=" বাটন: বড় গোল্ড গ্র্যাডিয়েন্ট উইথ পালস অ্যানিমেশন */
    .btn-eq {
      background: linear-gradient(135deg, #D4AF37, #8B6914);
      color: #FFFFFF;
      border: 1px solid #F7E7A0;
      grid-column: span 4;
      font-size: 24px;
      animation: pulseGlow 2s infinite;
    }
    .btn-eq:hover {
      background: linear-gradient(135deg, #F7E7A0, #D4AF37);
      color: #0B1120;
      transform: scale(1.02);
    }

    /* গুগল শিট সেভ বাটন */
    .save-btn {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      background: linear-gradient(135deg, #D4AF37, #F7E7A0);
      color: #0B1120;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
    }
    .save-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(247, 231, 160, 0.6);
    }
    #statusMsg { text-align: center; margin-top: 12px; font-size: 14px; font-weight: bold; color: #F7E7A0; }
  </style>
</head>
<body>

  <!-- ভাসমান স্পার্কল ইফেক্ট -->
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>

  <div class="navbar">
    <a href="index.html" class="active">ক্যালকুলেটর</a>
    <a href="polish.html">পলিশের হিসাব</a>
    <a href="price.html">দামের হিসাব</a>
  </div>

  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="buttons">
      <button class="btn-clear" onclick="clearDisplay()">C</button>
      <button class="btn-op" onclick="appendValue('/')">÷</button>
      <button class="btn-op" onclick="appendValue('*')">×</button>
      
      <button class="btn-num" onclick="appendValue('7')">7</button>
      <button class="btn-num" onclick="appendValue('8')">8</button>
      <button class="btn-num" onclick="appendValue('9')">9</button>
      <button class="btn-op" onclick="appendValue('-')">-</button>
      
      <button class="btn-num" onclick="appendValue('4')">4</button>
      <button class="btn-num" onclick="appendValue('5')">5</button>
      <button class="btn-num" onclick="appendValue('6')">6</button>
      <button class="btn-op" onclick="appendValue('+')">+</button>
      
      <button class="btn-num" onclick="appendValue('1')">1</button>
      <button class="btn-num" onclick="appendValue('2')">2</button>
      <button class="btn-num" onclick="appendValue('3')">3</button>
      <button class="btn-num" onclick="appendValue('0')">0</button>
      
      <button class="btn-eq" onclick="calculate()">=</button>
    </div>
    <button class="save-btn" onclick="saveToSheet()">গুগল শিটে সেভ করুন</button>
    <div id="statusMsg"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXVzelPSzdxSwqPboXn4DPsfPUC0ZxJ_bNEkDgx766V8AzBzNwVLxDsE4uqP8GdWVe/exec";
    let currentInput = "", historyInput = "", lastResult = "";

    function appendValue(val) { currentInput += val; document.getElementById('display').value = currentInput; }
    function clearDisplay() { currentInput = ""; historyInput = ""; lastResult = ""; document.getElementById('display').value = ""; }
    function calculate() {
      try { historyInput = currentInput; lastResult = eval(currentInput); document.getElementById('display').value = lastResult; currentInput = lastResult.toString(); }
      catch (e) { document.getElementById('display').value = 'ত্রুটি'; currentInput = ""; }
    }
    function saveToSheet() {
      const msg = document.getElementById('statusMsg');
      let valToSave = lastResult || currentInput;
      let data = { type: "Calculator", date: new Date().toLocaleDateString(), itemDesc: `হিসাব: ${historyInput ? historyInput + ' = ' + valToSave : valToSave}`, totalPrice: valToSave };
      msg.textContent = 'সেভ হচ্ছে...';
      fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
      .then(() => { msg.textContent = 'সফলভাবে জমা হয়েছে!'; setTimeout(() => msg.textContent = '', 4000); });
    }
  </script>
</body>
</html>
