<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রিমিয়াম জুয়েলারি বিজনেস ক্যালকুলেটর</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Hind+Siliguri:wght@500;700&display=swap');

        body {
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            font-family: 'Hind Siliguri', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            color: #f3f4f6;
        }

        /* গোল্ডেন বিজনেস লুক কন্টেইনার */
        .calculator-container {
            background: linear-gradient(145deg, rgba(17, 24, 39, 0.9), rgba(3, 7, 18, 0.95));
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 25px;
            width: 350px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(212, 175, 55, 0.15);
            border: 2px solid #d4af37; /* খাঁটি সোনালী বর্ডার */
            position: relative;
        }

        .calculator-container::before {
            content: '★ গোল্ড বিজনেস ★';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #d4af37;
            color: #030712;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 10px;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* ওপরের নেভিগেশন */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: rgba(212, 175, 55, 0.05);
            padding: 5px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            margin-top: 10px;
        }

        .nav-buttons button {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px 4px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            color: #9ca3af;
            font-size: 13px;
            font-family: 'Hind Siliguri', sans-serif;
            transition: all 0.3s ease;
        }

        .nav-buttons button.active {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #030712;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        .nav-buttons button:hover:not(.active) {
            color: #d4af37;
            background: rgba(212, 175, 55, 0.1);
        }

        /* বিজনেস ডিসপ্লে */
        #display {
            width: 100%;
            height: 65px;
            background: #0b0f19;
            border-radius: 12px;
            color: #f3e5ab; /* প্রিমিয়াম গোল্ডেন টেক্সট কালার */
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 700;
            text-align: right;
            padding: 10px 15px;
            box-sizing: border-box;
            margin-bottom: 20px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.9);
            letter-spacing: 1px;
        }

        /* বাটন গ্রিড */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        /* এক্সিকিউটিভ বাটন স্টাইল */
        button.calc-btn {
            padding: 15px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #1f2937;
            color: #f3f4f6;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button.calc-btn:active {
            transform: scale(0.95);
        }

        button.calc-btn:hover {
            background: #374151;
            border-color: rgba(212, 175, 55, 0.3);
        }

        /* বিশেষ গোল্ড বিজনেস কালার ভ্যারিয়েশন */
        .btn-clear {
            background: linear-gradient(135deg, #991b1b, #7f1d1d) !important;
            color: #fff;
            border-color: #b91c1c;
        }

        .btn-back {
            background: linear-gradient(135deg, #1e3a8a, #172554) !important;
            color: #fff;
            border-color: #2563eb;
        }

        .btn-operator {
            background: linear-gradient(135deg, #d4af37, #997a15) !important;
            color: #030712;
            font-weight: 900;
            border-color: #fef08a;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* সমান (=) গোল্ডেন বাটন */
        .btn-equal {
            grid-column: span 4;
            background: linear-gradient(135deg, #b45309, #78350f) !important;
            color: #fef3c7;
            padding: 15px;
            font-size: 20px;
            margin-top: 10px;
            border-radius: 10px;
            font-weight: 700;
            border: 1px solid #d4af37;
            box-shadow: 0 4px 15px rgba(180, 83, 9, 0.4);
            transition: all 0.3s ease;
        }

        .btn-equal:hover {
            background: linear-gradient(135deg, #d97706, #92400e) !important;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <!-- ওপরের নেভিগেশন বাটন -->
    <div class="nav-buttons">
        <button class="active">ক্যালকুলেটর</button>
        <button onclick="location.href='polish.html'">লিশের হিসাব</button>
        <button onclick="location.href='price.html'">দামের হিসাব</button>
    </div>

    <!-- ডিসপ্লে -->
    <input type="text" id="display" readonly placeholder="0">

    <!-- কিপ্যাড -->
    <div class="buttons-grid">
        <button class="calc-btn btn-clear" onclick="clearDisplay()">C</button>
        <button class="calc-btn btn-back" onclick="deleteDigit()">⌫</button>
        <button class="calc-btn btn-operator" onclick="appendValue('/')">÷</button>
        <button class="calc-btn btn-operator" onclick="appendValue('*')">×</button>

        <button class="calc-btn" onclick="appendValue('7')">7</button>
        <button class="calc-btn" onclick="appendValue('8')">8</button>
        <button class="calc-btn" onclick="appendValue('9')">9</button>
        <button class="calc-btn btn-operator" onclick="appendValue('-')">-</button>

        <button class="calc-btn" onclick="appendValue('4')">4</button>
        <button class="calc-btn" onclick="appendValue('5')">5</button>
        <button class="calc-btn" onclick="appendValue('6')">6</button>
        <button class="calc-btn btn-operator" onclick="appendValue('+')">+</button>

        <button class="calc-btn" onclick="appendValue('1')">1</button>
        <button class="calc-btn" onclick="appendValue('2')">2</button>
        <button class="calc-btn" onclick="appendValue('3')">3</button>
        <button class="calc-btn" onclick="appendValue('0')">0</button>
    </div>

    <button class="btn-equal calc-btn" onclick="calculateResult()">=</button>
</div>

<script>
    const display = document.getElementById('display');

    function appendValue(value) {
        if (display.value === 'ত্রুটি') {
            display.value = '';
        }
        display.value += value;
    }

    function clearDisplay() {
        display.value = '';
    }

    function deleteDigit() {
        display.value = display.value.slice(0, -1);
    }

    function calculateResult() {
        try {
            let result = eval(display.value);
            if (result === undefined || result === null || !isFinite(result)) {
                throw new Error("Invalid");
            }
            display.value = result;
        } catch (error) {
            display.value = 'ত্রুটি';
            setTimeout(clearDisplay, 1500);
        }
    }

    // কিবোর্ড শর্টকাট সাপোর্ট
    document.addEventListener('keydown', function(event) {
        const key = event.key;
        if (/[0-9]/.test(key)) {
            appendValue(key);
        } else if (['+', '-', '*', '/'].includes(key)) {
            appendValue(key);
        } else if (key === 'Enter') {
            calculateResult();
        } else if (key === 'Backspace') {
            deleteDigit();
        } else if (key === 'c' || key === 'C') {
            clearDisplay();
        }
    });
</script>

</body>
</html>
