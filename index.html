<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JewelCalc Pro | Jewellery Calculator</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#080808;
    --card:#151515;
    --card2:#1d1d1d;
    --gold:#d4af37;
    --gold-light:#f5e6c8;
    --text:#ffffff;
    --muted:#aaa;
    --border:rgba(212,175,55,.18);
    --green:#22c55e;
    --red:#ef4444;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at top,#30220b,transparent 35%),
    linear-gradient(180deg,#080808,#101010);
    color:var(--text);
    font-family:Inter,sans-serif;
}


/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(15px);
    background:rgba(8,8,8,.85);
    border-bottom:1px solid var(--border);
}

.container{
    width:min(1200px,92%);
    margin:auto;
}


.navbar{
    height:80px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}


.logo{
    display:flex;
    align-items:center;
    gap:12px;
}


.logo-icon{

    width:50px;
    height:50px;
    border-radius:15px;

    display:grid;
    place-items:center;

    background:
    linear-gradient(135deg,var(--gold-light),var(--gold));

    color:#111;
    font-weight:900;
    font-size:25px;

    box-shadow:
    0 0 25px rgba(212,175,55,.35);
}


.logo h1{

    font-family:Cinzel,serif;
    color:var(--gold-light);
    font-size:26px;

}


.logo span{
    color:var(--gold);
}



.nav-menu{

    display:flex;
    gap:20px;
}


.nav-menu a{

    color:#ddd;
    text-decoration:none;
    padding:10px 15px;
    border-radius:10px;
    transition:.3s;

}


.nav-menu a:hover{

    color:var(--gold);
    background:rgba(212,175,55,.08);

}



/* HERO */


.hero{

    padding:70px 0 40px;

}


.hero-box{

    background:
    linear-gradient(180deg,#181818,#111);

    border:1px solid var(--border);

    border-radius:30px;

    padding:50px;

    box-shadow:
    0 30px 70px rgba(0,0,0,.5);

}


.hero h2{

    font-family:Cinzel,serif;

    font-size:clamp(35px,5vw,60px);

    line-height:1.2;

}


.gold{

    color:var(--gold);

}


.hero p{

    margin-top:20px;

    color:#ccc;

    max-width:700px;

    line-height:1.8;

}



/* BUTTON */


.btn{

    margin-top:25px;

    padding:15px 30px;

    border-radius:14px;

    border:none;

    cursor:pointer;

    font-weight:700;

    transition:.3s;

}


.btn-gold{

    background:
    linear-gradient(135deg,var(--gold-light),var(--gold));

    color:#111;

}


.btn-gold:hover{

    transform:translateY(-3px);

    box-shadow:
    0 10px 30px rgba(212,175,55,.35);

}



/* MAIN LAYOUT */


.main-grid{

    display:grid;

    grid-template-columns:380px 1fr;

    gap:25px;

    padding-bottom:60px;

}


.card{

    background:
    linear-gradient(180deg,var(--card),#111);

    border:1px solid var(--border);

    border-radius:25px;

    overflow:hidden;

    box-shadow:
    0 20px 50px rgba(0,0,0,.4);

}


.card-header{

    padding:22px;

    border-bottom:1px solid var(--border);

}


.card-header h3{

    color:var(--gold);

    font-family:Cinzel,serif;

}


.card-body{

    padding:25px;

}



/* FORM */


.group{

    margin-bottom:18px;

}


label{

    display:block;

    margin-bottom:8px;

    color:#ddd;

    font-size:14px;

}


input,
select{

    width:100%;

    height:52px;

    background:#090909;

    border:1px solid var(--border);

    color:white;

    border-radius:12px;

    padding:0 15px;

    outline:none;

}


input:focus,
select:focus{

    border-color:var(--gold);

    box-shadow:
    0 0 0 3px rgba(212,175,55,.12);

}


.row{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;

}
