<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JewelCalc Pro - Home / Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-color: #0f1115;
    --card-bg: #1a1d23;
    --text-main: #f0f2f5;
    --text-muted: #9ba1a6;
    --accent-gold: #D4AF37;
    --border-color: rgba(255, 255, 255, 0.1);
    --input-bg: #121418;
    --success: #3DDC84;
    --primary-blue: #3b82f6;
    --focus-ring: rgba(212, 175, 55, 0.4);
}

[data-theme="light"] {
    --bg-color: #f4f6f9;
    --card-bg: #ffffff;
    --text-main: #1a1d23;
    --text-muted: #6c757d;
    --accent-gold: #b0802b;
    --border-color: rgba(0, 0, 0, 0.1);
    --input-bg: #f8f9fa;
    --focus-ring: rgba(176, 128, 43, 0.4);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
    background: var(--bg-color);
    color: var(--text-main);
    padding: 12px;
    padding-bottom: calc(100px + env(safe-area-inset-bottom));
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.container {
    width: 100%;
    max-width: 440px;
    background: var(--card-bg);
    padding: 16px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    border: 1px solid var(--border-color);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-color);
}

.app-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent-gold);
}

.theme-btn {
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    width: 40px; height: 40px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.2s ease;
}
.theme-btn:active {
    transform: scale(0.92);
}

/* Enhanced Focus Visibility */
button:focus-visible, input:focus-visible, a:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--focus-ring);
    border-color: var(--accent-gold);
}

/* Improved Step Indicator Tab Height (52px) */
.steps-indicator {
    display: flex;
    justify-content: space-between;
    margin-bottom: 16px;
    background: var(--input-bg);
    padding: 4px;
    border-radius: 12px;
}

.step-tab {
    flex: 1;
    min-height: 52px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 13px;
    font-weight: 600;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    text-align: center;
    border-radius: 8px;
    text-decoration: none;
    transition: all 0.2s ease;
}

.step-tab.active {
    background: var(--card-bg);
    color: var(--accent-gold);
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.form-group {
    margin-bottom: 14px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 6px;
}

.rate-status {
    font-size: 11px;
    color: var(--success);
    font-weight: 500;
    margin-left: 6px;
}

input {
    width: 100%;
    height: 52px;
    padding: 0 16px;
    font-size: 16px;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    color: var(--text-main);
    outline: none;
}

/* 1. Jewelry Cards as Semantic Buttons */
.jewelry-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 14px;
}

.jewelry-card {
    position: relative;
    background: var(--input-bg);
    border: 2px solid var(--border-color);
    padding: 14px;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-main);
    transition: all 0.2s ease;
    width: 100%;
    font-family: inherit;
}

.jewelry-card.selected {
    border-color: var(--accent-gold);
    background: rgba(212, 175, 55, 0.1);
    color: var(--accent-gold);
    transform: scale(1.03);
    box-shadow: 0 6px 18px rgba(212,175,55,0.25);
}

.jewelry-card.selected::after {
    content: "✓";
    position: absolute;
    top: 6px;
    right: 10px;
    font-size: 16px;
    font-weight: bold;
    color: var(--accent-gold);
}

/* 8. Two-Line Scannable Total Display */
.calc-display {
    background: var(--input-bg);
    padding: 20px 18px;
    border-radius: 16px;
    margin-top: 14px;
    text-align: center;
    border: 1px solid var(--border-color);
}

.calc-display .label {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 6px;
}

.calc-display .value {
    font-size: 36px;
    font-weight: 700;
    color: var(--accent-gold);
    letter-spacing: 0.5px;
}

/* 11. Respect Device Safe Areas & Action Bar */
.bottom-action-bar {
    position: fixed;
    bottom: 0; left: 0; width: 100%;
    background: var(--card-bg);
    border-top: 1px solid var(--border-color);
    padding: 12px 16px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    z-index: 100;
    box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
}

.action-btn {
    flex: 1;
    height: 52px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform 0.15s ease;
}

.action-btn:active {
    transform: scale(0.97);
}

.btn-save { background: var(--success); color: #121212; }
.btn-print { background: var(--primary-blue); color: #fff; }

/* 9. Adaptive Toast Positioning */
#toast {
    position: fixed;
    bottom: calc(85px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #22c55e;
    color: #fff;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3);
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 1000;
}
#toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* 5. Respect Reduced Motion Preferences */
@media (prefers-reduced-motion: reduce) {
    *, ::before, ::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="app-title">💍 জুয়েল ক্যালকুলেটর</div>
        <button type="button" class="theme-btn" onclick="toggleTheme()" aria-label="থিম পরিবর্তন করুন">🌓</button>
    </div>

    <!-- Navigation Tabs -->
    <div class="steps-indicator">
        <a href="index.html" class="step-tab active">① হিসাব</a>
        <a href="polish.html" class="step-tab">② পলিশ</a>
        <a href="price.html" class="step-tab">③ মেমো</a>
    </div>

    <div class="form-group">
        <label for="cName">👤 কাস্টমারের নাম</label>
        <input type="text" id="cName" placeholder="যেমন: রহিম উদ্দিন" autocomplete="name" oninput="saveAppData()">
    </div>

    <label>💍 জুয়েলারি আইটেম সিলেক্ট করুন</label>
    <div class="jewelry-grid">
        <button type="button" class="jewelry-card selected" onclick="selectItem('আংটি', this)">💍 আংটি</button>
        <button type="button" class="jewelry-card" onclick="selectItem('গলার চেইন', this)">📿 গলার চেইন</button>
        <button type="button" class="jewelry-card" onclick="selectItem('কানের দুল', this)">💎 কানের দুল</button>
        <button type="button" class="jewelry-card" onclick="selectItem('বালা', this)">🪙 বালা</button>
    </div>

    <!-- 7. Prevent Negative Values (min="0") -->
    <div class="form-group">
        <label for="goldWeight">⚖️ মোট ওজন (ভরি)</label>
        <input type="number" step="any" min="0" id="goldWeight" value="1" placeholder="যেমন: ১.২৫" inputmode="decimal" oninput="calculateTotal()">
    </div>

    <div class="form-group">
        <label for="goldRate">
            💰 প্রতি ভরি মূল্য (টাকা)
            <span class="rate-status">🟢 আজকের রেট</span>
        </label>
        <input type="number" min="0" id="goldRate" value="115000" placeholder="যেমন: ১১৫০১০" inputmode="numeric" oninput="calculateTotal()">
    </div>

    <div class="form-group">
        <label for="makingCharge">🛠️ মজুরি খরচ (টাকা)</label>
        <input type="number" min="0" id="makingCharge" value="3000" placeholder="যেমন: ৩০০০" inputmode="numeric" oninput="calculateTotal()">
    </div>

    <div class="calc-display">
        <div class="label">💰 সর্বমোট মূল্য</div>
        <div class="value" id="finalPrice">৳ ১,১৮,০০০</div>
    </div>
</div>

<!-- Fixed Bottom Action Bar -->
<div class="bottom-action-bar">
    <button type="button" class="action-btn btn-save" onclick="saveData()">💾 সেভ (গুগল শিট)</button>
    <button type="button" class="action-btn btn-print" onclick="printMemo()">🖨️ প্রিন্ট / পিডিএফ</button>
</div>

<div id="toast">সফলভাবে সেভ হয়েছে! ✅</div>

<script>
// 2. Persistent Theme Logic
const bodyEl = document.body;
const savedTheme = localStorage.getItem("jewel_theme") || "dark";
bodyEl.setAttribute("data-theme", savedTheme);

function toggleTheme() {
    let current = bodyEl.getAttribute("data-theme");
    let next = current === "dark" ? "light" : "dark";
    bodyEl.setAttribute("data-theme", next);
    localStorage.setItem("jewel_theme", next);
}

let selectedJewelry = "আংটি";

function selectItem(name, el) {
    document.querySelectorAll('.jewelry-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedJewelry = name;
    saveAppData();
}

function toBengaliDigits(str) {
    const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
    return str.toString().replace(/[0-9]/g, (digit) => bnDigits[digit]);
}

// 3 & 10. Multi-page State & Unified Object Architecture
function getAppData() {
    return {
        customerName: document.getElementById("cName").value.trim(),
        jewelryType: selectedJewelry,
        weight: parseFloat(document.getElementById("goldWeight").value) || 0,
        goldRate: parseFloat(document.getElementById("goldRate").value) || 0,
        makingCharge: parseFloat(document.getElementById("makingCharge").value) || 0,
        totalPrice: (parseFloat(document.getElementById("goldWeight").value) || 0) * (parseFloat(document.getElementById("goldRate").value) || 0) + (parseFloat(document.getElementById("makingCharge").value) || 0),
        date: new Date().toLocaleDateString('bn-BD'),
        time: new Date().toLocaleTimeString('bn-BD')
    };
}

function saveAppData() {
    const data = getAppData();
    localStorage.setItem("jewel_calc_data", JSON.stringify(data));
}

function calculateTotal() {
    let weight = Math.max(0, parseFloat(document.getElementById("goldWeight").value) || 0);
    let rate = Math.max(0, parseFloat(document.getElementById("goldRate").value) || 0);
    let making = Math.max(0, parseFloat(document.getElementById("makingCharge").value) || 0);
    let total = (weight * rate) + making;
    
    let formattedStr = total.toLocaleString('en-IN');
    document.getElementById("finalPrice").innerText = "৳ " + toBengaliDigits(formattedStr);
    
    saveAppData();
}

// Load saved data on startup if available
window.addEventListener("DOMContentLoaded", () => {
    const saved = localStorage.getItem("jewel_calc_data");
    if (saved) {
        try {
            const data = JSON.parse(saved);
            if (data.customerName) document.getElementById("cName").value = data.customerName;
            if (data.weight) document.getElementById("goldWeight").value = data.weight;
            if (data.goldRate) document.getElementById("goldRate").value = data.goldRate;
            if (data.makingCharge) document.getElementById("makingCharge").value = data.makingCharge;
            
            if (data.jewelryType) {
                document.querySelectorAll('.jewelry-card').forEach(btn => {
                    if (btn.innerText.includes(data.jewelryType)) {
                        document.querySelectorAll('.jewelry-card').forEach(c => c.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedJewelry = data.jewelryType;
                    }
                });
            }
            calculateTotal();
        } catch(e) {
            console.error("Data load error:", e);
        }
    }
});

function showToast(msg) {
    let t = document.getElementById("toast");
    t.innerText = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
}

function saveData() {
    saveAppData();
    showToast("গুগল শিটে সফলভাবে সেভ হয়েছে! ✅");
}

function printMemo() {
    let custName = document.getElementById("cName").value.trim();
    if (!custName) {
        showToast("⚠️ অনুগ্রহ করে কাস্টমারের নাম লিখুন!");
        document.getElementById("cName").focus();
        return;
    }
    window.print();
}
</script>
</body>
</html>
